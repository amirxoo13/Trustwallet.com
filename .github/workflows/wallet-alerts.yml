name: Wallet alerts

on:
  schedule:
    - cron: "5 * * * *"
    - cron: "35 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Send due price and balance alerts
        run: curl -fsSL --retry 3 --retry-delay 15 -m 55 "https://trustwalletblockchain.vercel.app/api/notify"